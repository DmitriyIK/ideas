<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Приём заявок на идеи{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6fa; color: #222; }
    nav { background: #2d3436; padding: 12px 24px; }
    nav a { color: #fff; margin-right: 20px; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 760px; margin: 30px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px 24px;
            margin-bottom: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input[type=text], input[type=email], textarea, select {
      width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc;
      border-radius: 6px; box-sizing: border-box; font: inherit; }
    input[type=checkbox] { margin-right: 6px; }
    .checkbox-row label { display: inline; font-weight: 400; }
    button { margin-top: 20px; background: #0984e3; color: #fff; border: none;
             padding: 12px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #0873c4; }
    .error { color: #d63031; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #eceff3; }
    h1 { font-size: 26px; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'submit' %}">Подать заявку</a>
    <a href="{% url 'published' %}">Опубликованные идеи</a>
    <a href="{% url 'stats' %}">Статистика</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
